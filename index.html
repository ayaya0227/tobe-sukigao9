<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好きな顔TOP9</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #fff8df;
  color: #333;
}

#app {
  max-width: 700px;
  margin: auto;
  padding: 24px 16px 50px;
}

h1 {
  text-align: center;
  color: #8d7350;
  font-size: 25px;
  margin: 10px 0 8px;
}

.subtitle {
  text-align: center;
  color: #806f55;
  font-size: 14px;
  margin-bottom: 22px;
}

.progress {
  text-align: center;
  color: #a18a62;
  font-weight: bold;
  margin-bottom: 15px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.person {
  position: relative;
  background: white;
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 3px 12px rgba(100,80,30,.10);
  border: 4px solid transparent;
  cursor: pointer;
  transition: .15s;
}

.person.selected {
  border-color: #d5b45d;
  transform: scale(.97);
}

.person img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 13px;
  display: block;
}

.person-name {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  padding: 9px 3px 5px;
}

.check {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #c5a64d;
  box-shadow: 0 2px 7px rgba(0,0,0,.15);
}

.person.selected .check {
  background: #d5b45d;
  color: white;
}

button {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 25px auto 0;
  padding: 15px;
  border: 0;
  border-radius: 999px;
  background: #b79b5b;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
}

.vs-area {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.vs-card {
  background: white;
  border-radius: 20px;
  padding: 8px;
  box-shadow: 0 4px 15px rgba(100,80,30,.12);
  cursor: pointer;
  border: 4px solid transparent;
}

.vs-card:active {
  transform: scale(.97);
}

.vs-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 14px;
}

.vs-name {
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  padding: 10px 2px;
}

.vs-text {
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  margin: 14px 0;
  color: #9a8050;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.result-card {
  background: white;
  border-radius: 13px;
  padding: 5px;
  box-shadow: 0 3px 9px rgba(100,80,30,.12);
  position: relative;
}

.result-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 9px;
  display: block;
}

.rank {
  position: absolute;
  top: 7px;
  left: 7px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #b79b5b;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  z-index: 2;
}

.result-name {
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  padding: 7px 2px 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.share {
  background: #111;
}

.notice {
  text-align: center;
  font-size: 13px;
  color: #806f55;
  line-height: 1.6;
  margin: 15px 0;
}

.hidden {
  display: none;
}

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #806f55;
}
</style>
</head>

<body>

<div id="app">
  <div class="loading">写真を読み込んでるよ…💛</div>
</div>

<script>

const REPO_API =
"https://api.github.com/repos/aya2742g-crypto/tobe-sukigao9/contents/";

let people = [];
let selected = [];
let candidates = [];
let survivors = [];
let finalScores = {};
let currentPair = null;
let currentRound = [];
let nextRound = [];


/* -------------------------
   GitHubから写真を取得
------------------------- */

async function loadPhotos() {

  try {

    const response = await fetch(REPO_API);

    if (!response.ok) {
      throw new Error("GitHub API error");
    }

    const files = await response.json();

    people = files
      .filter(file =>
        file.type === "file" &&
        /\.(jpg|jpeg|png|webp)$/i.test(file.name)
      )
      .map(file => {

        const filename = file.name;

        let name = filename
          .replace(/\.(jpg|jpeg|png|webp)$/i, "")
          .replace(/^IMG[_＿]?/, "")
          .trim();

        return {
          name: name,
          image: file.download_url
        };

      });

    if (people.length < 9) {
      throw new Error("写真が9枚未満です");
    }

    showStart();

  } catch (error) {

    document.getElementById("app").innerHTML = `
      <h1>😭 写真を読み込めなかった</h1>
      <p class="notice">
        GitHubの写真フォルダを確認してね。<br>
        少し待ってからページを更新してみて！
      </p>
    `;
  }
}


/* -------------------------
   最初
------------------------- */

function showStart() {

  document.getElementById("app").innerHTML = `
    <h1>✨ あなたの「好きな顔TOP9」 ✨</h1>

    <p class="subtitle">
      まずは「好き！」と思う顔を<br>
      できるだけ選んでね💛
    </p>

    <button onclick="startSelection()">
      はじめる！
    </button>
  `;
}


/* -------------------------
   4人ずつ表示
------------------------- */

let groupIndex = 0;

function startSelection() {

  selected = [];
  groupIndex = 0;

  showGroup();
}


function showGroup() {

  const start = groupIndex * 4;
  const group = people.slice(start, start + 4);

  if (group.length === 0) {
    finishSelection();
    return;
  }

  document.getElementById("app").innerHTML = `

    <h1>まずは好きな顔を選んでね💛</h1>

    <div class="progress">
      ${groupIndex + 1} / ${Math.ceil(people.length / 4)}
    </div>

    <p class="notice">
      好きな人は何人選んでもOK！<br>
      タップするとチェックがつくよ✨
    </p>

    <div class="cards" id="cards"></div>

    <button id="nextButton" onclick="nextGroup()" disabled>
      次へ
    </button>
  `;

  const container = document.getElementById("cards");

  group.forEach(person => {

    const card = document.createElement("div");

    card.className = "person";

    card.innerHTML = `
      <div class="check">✓</div>
      <img src="${person.image}" alt="${person.name}">
      <div class="person-name">${person.name}</div>
    `;

    card.onclick = () => {

      if (selected.includes(person)) {

        selected = selected.filter(p => p !== person);
        card.classList.remove("selected");

      } else {

        selected.push(person);
        card.classList.add("selected");

      }

      document.getElementById("nextButton").disabled =
        selected.length === 0;
    };

    container.appendChild(card);
  });
}


function nextGroup() {

  groupIndex++;

  if (groupIndex >= Math.ceil(people.length / 4)) {

    finishSelection();

  } else {

    showGroup();

  }
}


/* -------------------------
   候補決定
------------------------- */

function finishSelection() {

  if (selected.length < 9) {

    document.getElementById("app").innerHTML = `

      <h1>もう少しだけ💛</h1>

      <p class="notice">
        TOP9を作るために、<br>
        最低9人は候補に選んでね🥹
      </p>

      <button onclick="startSelection()">
        選び直す
      </button>
    `;

    return;
  }

  candidates = [...selected];

  startTournament();
}


/* -------------------------
   二択トーナメント
------------------------- */

function startTournament() {

  if (candidates.length <= 9) {

    startFinalRanking();
    return;

  }

  survivors = [];
  currentRound = shuffle([...candidates]);

  playNextMatch();
}


function playNextMatch() {

  if (currentRound.length === 0) {

    candidates = survivors;

    startTournament();

    return;
  }

  if (currentRound.length === 1) {

    survivors.push(currentRound[0]);
    currentRound = [];
    playNextMatch();
    return;
  }

  const a = currentRound.shift();
  const b = currentRound.shift();

  currentPair = [a, b];

  document.getElementById("app").innerHTML = `

    <h1>どっちの顔が好き？</h1>

    <div class="progress">
      あと ${Math.ceil(currentRound.length / 2) + 1} 組くらい💛
    </div>

    <div class="vs-area">

      <div class="vs-card" onclick="chooseWinner(0)">
        <img src="${a.image}">
        <div class="vs-name">${a.name}</div>
      </div>

      <div class="vs-card" onclick="chooseWinner(1)">
        <img src="${b.image}">
        <div class="vs-name">${b.name}</div>
      </div>

    </div>

    <div class="vs-text">VS</div>

    <p class="notice">
      直感で「好き！」と思う方をタップしてね✨
    </p>
  `;
}


function chooseWinner(index) {

  const winner = currentPair[index];

  survivors.push(winner);

  playNextMatch();
}


/* -------------------------
   最終9人の順位決定
------------------------- */

function startFinalRanking() {

  finalScores = {};

  candidates.forEach(person => {
    finalScores[person.name] = 0;
  });

  const pairs = [];

  for (let i = 0; i < candidates.length; i++) {
    for (let j = i + 1; j < candidates.length; j++) {

      pairs.push([
        candidates[i],
        candidates[j]
      ]);

    }
  }

  currentRound = shuffle(pairs);

  playFinalMatch();
}


function playFinalMatch() {

  if (currentRound.length === 0) {

    const ranking = [...candidates].sort(
      (a,b) =>
        finalScores[b.name] - finalScores[a.name]
    );

    showResult(ranking.slice(0,9));

    return;
  }

  currentPair = currentRound.shift();

  const a = currentPair[0];
  const b = currentPair[1];

  document.getElementById("app").innerHTML = `

    <h1>最後のランキング決め🏆</h1>

    <p class="notice">
      どっちの顔が好き？<br>
      直感で選んでね💛
    </p>

    <div class="vs-area">

      <div class="vs-card" onclick="chooseFinalWinner(0)">
        <img src="${a.image}">
        <div class="vs-name">${a.name}</div>
      </div>

      <div class="vs-card" onclick="chooseFinalWinner(1)">
        <img src="${b.image}">
        <div class="vs-name">${b.name}</div>
      </div>

    </div>

    <div class="vs-text">VS</div>
  `;
}


function chooseFinalWinner(index) {

  const winner = currentPair[index];

  finalScores[winner.name]++;

  playFinalMatch();
}


/* -------------------------
   結果
------------------------- */

function showResult(ranking) {

  document.getElementById("app").innerHTML = `

    <h1>✨ あなたの「好きな顔TOP9」 ✨</h1>

    <div class="result-grid" id="resultGrid"></div>

    <button onclick="shareX()" class="share">
      𝕏 Xでシェア
    </button>

    <button onclick="location.reload()">
      最初からやり直す
    </button>
  `;

  const grid = document.getElementById("resultGrid");

  ranking.forEach((person, index) => {

    const card = document.createElement("div");

    card.className = "result-card";

    card.innerHTML = `
      <div class="rank">${index + 1}</div>
      <img src="${person.image}" alt="${person.name}">
      <div class="result-name">${person.name}</div>
    `;

    grid.appendChild(card);
  });

  window.finalRanking = ranking;
}


/* -------------------------
   Xシェア
------------------------- */

function shareX() {

  const names = window.finalRanking
    .map((person, i) => `${i + 1}. ${person.name}`)
    .join("\n");

  const text =
`✨ 私の「好きな顔TOP9」✨

${names}

#好きな顔9選`;

  const url =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text);

  window.open(url, "_blank");
}


/* -------------------------
   シャッフル
------------------------- */

function shuffle(array) {

  const arr = [...array];

  for (let i = arr.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}


loadPhotos();

</script>

</body>
</html>
