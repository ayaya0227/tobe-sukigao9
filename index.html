<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好きな顔TOP4</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff8df;
  color: #5f513d;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
    "Yu Gothic", sans-serif;
}

#app {
  max-width: 700px;
  margin: auto;
  padding: 24px 16px 50px;
}

h1 {
  text-align: center;
  color: #8d7350;
  font-size: 25px;
  margin: 8px 0 12px;
}

.sub {
  text-align: center;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
}

.progress {
  text-align: center;
  color: #a08552;
  font-weight: bold;
  margin-bottom: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.person {
  position: relative;
  background: white;
  border: 4px solid transparent;
  border-radius: 18px;
  padding: 7px;
  box-shadow: 0 3px 12px rgba(100,80,30,.12);
  cursor: pointer;
}

.person.selected {
  border-color: #d5b45d;
}

.person img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 13px;
  display: block;
}

.name {
  text-align: center;
  font-weight: bold;
  font-size: 14px;
  padding: 8px 2px 4px;
}

.check {
  position: absolute;
  top: 11px;
  right: 11px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 7px rgba(0,0,0,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c9aa58;
  font-weight: bold;
}

.selected .check {
  background: #c9aa58;
  color: white;
}

button {
  display: block;
  width: 92%;
  max-width: 360px;
  margin: 18px auto 0;
  padding: 14px;
  border: 0;
  border-radius: 999px;
  background: #b79a5b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .4;
}

.skip {
  background: #e4d6ad;
  color: #66563d;
}

.vs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.vsCard {
  background: white;
  border-radius: 20px;
  padding: 8px;
  box-shadow: 0 4px 15px rgba(100,80,30,.12);
  cursor: pointer;
}

.vsCard img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 14px;
  display: block;
}

.vsCard .name {
  font-size: 16px;
  padding: 10px 2px;
}

.result {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.resultCard {
  position: relative;
  background: white;
  padding: 6px;
  border-radius: 16px;
  box-shadow: 0 3px 10px rgba(100,80,30,.12);
}

.resultCard img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 11px;
  display: block;
}

.rank {
  position: absolute;
  left: 9px;
  top: 9px;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: #b79a5b;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  z-index: 2;
}

.resultName {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  padding: 8px 2px;
}

.x {
  background: #111;
}

.error {
  text-align: center;
  padding: 50px 15px;
}
</style>
</head>

<body>

<div id="app">
  <p class="sub">写真を読み込んでるよ…💛</p>
</div>

<script>

const USER = "ayaya0227";
const REPO = "tobe-sukigao9";

const API =
  `https://api.github.com/repos/${USER}/${REPO}/contents/`;

let people = [];
let chosen = [];
let groupIndex = 0;

let tournament = [];
let scores = {};


/* =========================
   写真を読み込む
========================= */

async function loadPhotos() {

  try {

    const response = await fetch(API);
    const files = await response.json();

    if (!Array.isArray(files)) {
      throw new Error();
    }

    people = files
      .filter(file =>
        file.type === "file" &&
        /\.(jpg|jpeg|png|webp)$/i.test(file.name)
      )
      .map(file => {

        const name = file.name
          .replace(/\.(jpg|jpeg|png|webp)$/i, "")
          .replace(/^IMG[_＿]?/, "");

        return {
          name: name,
          image: file.download_url
        };

      });

    if (people.length < 4) {
      throw new Error();
    }

    showStart();

  } catch (error) {

    document.getElementById("app").innerHTML = `
      <div class="error">
        <h1>😭 写真を読み込めない！</h1>
        <p class="sub">
          GitHubの写真を確認してね。<br>
          少し待ってからページを更新してみて！
        </p>
      </div>
    `;
  }
}


/* =========================
   スタート
========================= */

function showStart() {

  document.getElementById("app").innerHTML = `
    <h1>✨ あなたの「好きな顔TOP4」✨</h1>

    <p class="sub">
      まずは56人の中から<br>
      「好き！」と思う顔を選んでね💛<br>
      何人選んでもOK！
    </p>

    <button onclick="startChoosing()">
      スタート！
    </button>
  `;
}


/* =========================
   4人ずつ選ぶ
========================= */

function startChoosing() {

  chosen = [];
  groupIndex = 0;

  showGroup();
}


function showGroup() {

  const start = groupIndex * 4;
  const group = people.slice(start, start + 4);

  if (group.length === 0) {
    finishChoosing();
    return;
  }

  document.getElementById("app").innerHTML = `

    <h1>好きな顔を選んでね💛</h1>

    <div class="progress">
      ${groupIndex + 1} / ${Math.ceil(people.length / 4)}
    </div>

    <p class="sub">
      好きな人は何人選んでもOK！<br>
      「スキップ」でこの4人を飛ばせるよ✨
    </p>

    <div class="grid" id="peopleGrid"></div>

    <button id="nextButton"
            onclick="nextGroup()"
            disabled>
      次の4人へ
    </button>

    <button class="skip"
            onclick="skipGroup()">
      スキップ
    </button>
  `;

  const grid = document.getElementById("peopleGrid");

  group.forEach(person => {

    const card = document.createElement("div");

    card.className = "person";

    card.innerHTML = `
      <div class="check">✓</div>
      <img src="${person.image}" alt="${person.name}">
      <div class="name">${person.name}</div>
    `;

    card.onclick = () => {

      if (chosen.includes(person)) {

        chosen = chosen.filter(x => x !== person);

        card.classList.remove("selected");

      } else {

        chosen.push(person);

        card.classList.add("selected");
      }

      document.getElementById("nextButton").disabled =
        chosen.length === 0;
    };

    grid.appendChild(card);
  });
}


/* 次の4人 */

function nextGroup() {

  groupIndex++;

  if (groupIndex >= Math.ceil(people.length / 4)) {

    finishChoosing();

  } else {

    showGroup();
  }
}


/* スキップ */

function skipGroup() {

  groupIndex++;

  if (groupIndex >= Math.ceil(people.length / 4)) {

    finishChoosing();

  } else {

    showGroup();
  }
}


/* =========================
   候補決定
========================= */

function finishChoosing() {

  if (chosen.length < 4) {

    document.getElementById("app").innerHTML = `

      <h1>もう少しだけ💛</h1>

      <p class="sub">
        TOP4を作るために、<br>
        最低4人は選んでね！🥹<br><br>
        今選んだのは ${chosen.length} 人です。
      </p>

      <button onclick="startChoosing()">
        選び直す
      </button>
    `;

    return;
  }

  startTournament();
}


/* =========================
   TOP4決定
========================= */

function startTournament() {

  scores = {};

  chosen.forEach(person => {
    scores[person.name] = 0;
  });

  /*
    候補者同士の二択を作る
  */

  const pairs = [];

  for (let i = 0; i < chosen.length; i++) {

    for (let j = i + 1; j < chosen.length; j++) {

      pairs.push([
        chosen[i],
        chosen[j]
      ]);
    }
  }

  /*
    試合数が多くなりすぎないように
    最大36試合
  */

  pairs.sort(() => Math.random() - 0.5);

  tournament = pairs.slice(
    0,
    Math.min(36, pairs.length)
  );

  showBattle();
}


/* =========================
   二択
========================= */

function showBattle() {

  if (tournament.length === 0) {

    showResult();
    return;
  }

  const pair = tournament.shift();

  window.currentPair = pair;

  const a = pair[0];
  const b = pair[1];

  document.getElementById("app").innerHTML = `

    <h1>どっちの顔が好き？</h1>

    <p class="sub">
      直感で「好き！」と思う方をタップしてね💛
    </p>

    <div class="vs">

      <div class="vsCard"
           onclick="chooseWinner(0)">

        <img src="${a.image}">

        <div class="name">
          ${a.name}
        </div>

      </div>


      <div class="vsCard"
           onclick="chooseWinner(1)">

        <img src="${b.image}">

        <div class="name">
          ${b.name}
        </div>

      </div>

    </div>
  `;
}


/* 勝者 */

function chooseWinner(index) {

  const winner =
    window.currentPair[index];

  scores[winner.name]++;

  showBattle();
}


/* =========================
   結果TOP4
========================= */

function showResult() {

  const ranking = [...chosen]
    .sort((a, b) =>
      scores[b.name] - scores[a.name]
    )
    .slice(0, 4);

  window.finalRanking = ranking;

  document.getElementById("app").innerHTML = `

    <h1>✨ あなたの「好きな顔TOP4」✨</h1>

    <p class="sub">
      あなたが選んだ好きな顔はこちら💛
    </p>

    <div class="result"
         id="resultGrid">
    </div>

    <button class="x"
            onclick="shareX()">
      𝕏 Xでシェア
    </button>

    <button onclick="startChoosing()">
      最初からやり直す
    </button>
  `;

  const grid =
    document.getElementById("resultGrid");

  ranking.forEach((person, index) => {

    const card =
      document.createElement("div");

    card.className = "resultCard";

    card.innerHTML = `
      <div class="rank">
        ${index + 1}
      </div>

      <img src="${person.image}"
           alt="${person.name}">

      <div class="resultName">
        ${person.name}
      </div>
    `;

    grid.appendChild(card);
  });
}


/* =========================
   Xシェア
========================= */

function shareX() {

  const names =
    window.finalRanking
      .map((person, index) =>
        `${index + 1}. ${person.name}`
      )
      .join("\n");

  const text =
`✨ 私の「好きな顔TOP4」✨

${names}

#好きな顔4選`;

  const url =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text);

  window.open(url, "_blank");
}


/* スタート */

loadPhotos();

</script>

</body>
</html>
