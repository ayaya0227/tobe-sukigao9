<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>好きな顔TOP9</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#fff8df;
  color:#5f513d;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
#app{
  max-width:700px;
  margin:auto;
  padding:25px 16px 45px;
}
h1{
  text-align:center;
  font-size:25px;
  margin:8px 0 12px;
  color:#8c7349;
}
.sub{
  text-align:center;
  font-size:14px;
  line-height:1.7;
  margin-bottom:20px;
}
.progress{
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
  color:#a08552;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.person{
  background:white;
  border:4px solid transparent;
  border-radius:18px;
  padding:7px;
  position:relative;
  box-shadow:0 3px 12px #9b814222;
  cursor:pointer;
}
.person.selected{
  border-color:#d5b35c;
}
.person img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:13px;
  display:block;
}
.name{
  text-align:center;
  font-weight:bold;
  font-size:14px;
  padding:8px 2px 4px;
}
.check{
  position:absolute;
  right:11px;
  top:11px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:white;
  box-shadow:0 2px 7px #0002;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c9aa58;
  font-weight:bold;
}
.selected .check{
  background:#c9aa58;
  color:white;
}
button{
  display:block;
  width:92%;
  max-width:360px;
  margin:18px auto 0;
  padding:14px;
  border:0;
  border-radius:999px;
  background:#b79a5b;
  color:white;
  font-size:16px;
  font-weight:bold;
}
button:disabled{opacity:.4}
.skip{
  background:#e4d6ad;
  color:#66563d;
}
.vs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.vscard{
  background:white;
  border-radius:20px;
  padding:8px;
  box-shadow:0 4px 15px #9b814222;
}
.vscard img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
  display:block;
}
.vscard .name{
  font-size:16px;
  padding:10px 2px;
}
.vscard:active{transform:scale(.97)}
.result{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.resultCard{
  background:white;
  padding:5px;
  border-radius:13px;
  position:relative;
  box-shadow:0 3px 10px #9b814222;
}
.resultCard img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:9px;
  display:block;
}
.rank{
  position:absolute;
  left:7px;
  top:7px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#b79a5b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.resultName{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  padding:6px 1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.x{
  background:#111;
}
.error{
  text-align:center;
  padding:50px 15px;
}
</style>
</head>

<body>
<div id="app">
  <div class="sub">写真を読み込んでるよ…💛</div>
</div>

<script>

const USER = "ayaya0227";
const REPO = "tobe-sukigao9";

let people = [];
let chosen = [];
let groupNumber = 0;

let battleCandidates = [];
let battleIndex = 0;
let scores = {};

const API =
`https://api.github.com/repos/${USER}/${REPO}/contents/`;


/* 写真をGitHubから取得 */
async function loadPeople(){

  try{

    const res = await fetch(API);
    const files = await res.json();

    if(!Array.isArray(files)) throw new Error();

    people = files
      .filter(x =>
        x.type === "file" &&
        /\.(jpg|jpeg|png|webp)$/i.test(x.name)
      )
      .map(x => {

        const name = x.name
          .replace(/\.(jpg|jpeg|png|webp)$/i,"")
          .replace(/^IMG[_＿]?/,"");

        return {
          name:name,
          image:x.download_url
        };

      });

    if(people.length < 9) throw new Error();

    start();

  }catch(e){

    document.getElementById("app").innerHTML=`
      <div class="error">
        <h1>😭 写真が読み込めない！</h1>
        <p class="sub">
        GitHubの写真を確認してね。<br>
        少し待ってからページを更新してみて！
        </p>
      </div>
    `;
  }
}


/* 最初 */
function start(){

  document.getElementById("app").innerHTML=`
    <h1>✨ 好きな顔TOP9 ✨</h1>
    <p class="sub">
      まずは56人の中から<br>
      「好き！」と思う顔を選んでね💛<br>
      何人選んでもOK！
    </p>
    <button onclick="begin()">スタート！</button>
  `;
}


/* 4人ずつ開始 */
function begin(){

  chosen=[];
  groupNumber=0;

  showGroup();
}


/* 4人表示 */
function showGroup(){

  const start=groupNumber*4;
  const group=people.slice(start,start+4);

  if(group.length===0){
    finishChoosing();
    return;
  }

  document.getElementById("app").innerHTML=`
    <h1>好きな顔を選んでね💛</h1>

    <div class="progress">
      ${groupNumber+1} / ${Math.ceil(people.length/4)}
    </div>

    <p class="sub">
      好きな人を何人選んでもOK！<br>
      1人も選ばずスキップもできるよ✨
    </p>

    <div class="grid" id="people"></div>

    <button id="next" disabled onclick="nextGroup()">
      次の4人へ
    </button>

    <button class="skip" onclick="skipGroup()">
      スキップ
    </button>
  `;

  const box=document.getElementById("people");

  group.forEach(person=>{

    const card=document.createElement("div");
    card.className="person";

    card.innerHTML=`
      <div class="check">✓</div>
      <img src="${person.image}" alt="${person.name}">
      <div class="name">${person.name}</div>
    `;

    card.onclick=()=>{

      if(chosen.includes(person)){

        chosen=chosen.filter(x=>x!==person);
        card.classList.remove("selected");

      }else{

        chosen.push(person);
        card.classList.add("selected");

      }

      document.getElementById("next").disabled=false;
    };

    box.appendChild(card);
  });
}


/* 次の4人 */
function nextGroup(){

  groupNumber++;

  if(groupNumber>=Math.ceil(people.length/4)){

    finishChoosing();

  }else{

    showGroup();

  }
}


/* スキップ */
function skipGroup(){

  groupNumber++;

  if(groupNumber>=Math.ceil(people.length/4)){

    finishChoosing();

  }else{

    showGroup();

  }
}


/* 候補決定 */
function finishChoosing(){

  if(chosen.length<9){

    document.getElementById("app").innerHTML=`
      <h1>もう少しだけ💛</h1>

      <p class="sub">
        TOP9を作るために、<br>
        最低9人は選んでね！🥹<br><br>
        今選んだのは ${chosen.length} 人です。
      </p>

      <button onclick="begin()">
        最初から選び直す
      </button>
    `;

    return;
  }

  startBattle();
}


/* 二択開始 */
function startBattle(){

  battleCandidates=[...chosen];

  /*
    候補が9人ならそのまま結果へ。
    10人以上なら二択で勝敗をつけていく。
  */

  scores={};

  battleCandidates.forEach(p=>{
    scores[p.name]=0;
  });

  makeBattles();
}


/* 二択カードを作る */
function makeBattles(){

  const pairs=[];

  for(let i=0;i<battleCandidates.length;i++){

    for(let j=i+1;j<battleCandidates.length;j++){

      pairs.push([
        battleCandidates[i],
        battleCandidates[j]
      ]);

    }

  }

  /* 全部やると多すぎるのでランダムに最大36試合 */
  pairs.sort(()=>Math.random()-0.5);

  const limited=pairs.slice(
    0,
    Math.min(36,pairs.length)
  );

  window.battles=limited;
  battleIndex=0;

  nextBattle();
}


/* 次の二択 */
function nextBattle(){

  if(battleIndex>=window.battles.length){

    showResult();

    return;
  }

  const pair=window.battles[battleIndex];

  const a=pair[0];
  const b=pair[1];

  document.getElementById("app").innerHTML=`

    <h1>どっちの顔が好き？</h1>

    <div class="progress">
      ${battleIndex+1} / ${window.battles.length}
    </div>

    <p class="sub">
      直感で「好き！」と思う方を選んでね💛
    </p>

    <div class="vs">

      <div class="vscard" onclick="winner(0)">
        <img src="${a.image}">
        <div class="name">${a.name}</div>
      </div>

      <div class="vscard" onclick="winner(1)">
        <img src="${b.image}">
        <div class="name">${b.name}</div>
      </div>

    </div>
  `;
}


/* 勝者 */
function winner(which){

  const person=window.battles[battleIndex][which];

  scores[person.name]++;

  battleIndex++;

  nextBattle();
}


/* 結果 */
function showResult(){

  const ranking=[...battleCandidates]
    .sort((a,b)=>scores[b.name]-scores[a.name])
    .slice(0,9);

  window.finalRanking=ranking;

  document.getElementById("app").innerHTML=`
    <h1>✨ あなたの「好きな顔TOP9」 ✨</h1>

    <p class="sub">
      あなたが選んだ好きな顔はこちら💛
    </p>

    <div class="result" id="result"></div>

    <button class="x" onclick="shareX()">
      𝕏 Xでシェア
    </button>

    <button onclick="begin()">
      最初からやり直す
    </button>
  `;

  const box=document.getElementById("result");

  ranking.forEach((person,i)=>{

    const card=document.createElement("div");

    card.className="resultCard";

    card.innerHTML=`
      <div class="rank">${i+1}</div>
      <img src="${person.image}" alt="${person.name}">
      <div class="resultName">${person.name}</div>
    `;

    box.appendChild(card);
  });
}


/* X */
function shareX(){

  const names=window.finalRanking
    .map((p,i)=>`${i+1}. ${p.name}`)
    .join("\n");

  const text=
`✨ 私の「好きな顔TOP9」✨

${names}

#好きな顔9選`;

  const url=
    "https://twitter.com/intent/tweet?text="+
    encodeURIComponent(text);

  window.open(url,"_blank");
}


loadPeople();

</script>
</body>
</html>
